name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit public tree
        run: python scripts/audit_public_tree.py
      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -v
      - name: Parse all Python sources
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = [*Path("rainbow").glob("*.py"), *Path("hardware").glob("*.py")]
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Parsed {len(paths)} Python files")
          PY

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
