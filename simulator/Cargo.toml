[package]
name = "laser_sim"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.12"
image = "0.25.5"
itertools = "0.14.0"
numpy = "0.23.0"
ordered-float = "5.0.0"
pyo3 = { version = "0.23.0", features = ["extension-module"] }
rand = "0.8.0"
rand_distr = "0.4"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.139"
serde_with = "3.12.0"

[lib]
crate-type = ["cdylib"]

[package.metadata.maturin]
name = "laser_sim"
